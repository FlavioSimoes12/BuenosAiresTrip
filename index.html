<title>Buenos Aires Companion</title>
<style>
:root{
  --navy:#1F4E79; --ice:#F8F9FA; --gray:#E9ECEF; --gold:#C9A227; --green:#4a7c59;
  --bg:#0f1115; --surface:#171a21; --surface2:#1f232c; --border:#2a2f3a;
  --text:#e8e9ec; --muted:#8a8f9c; --dim:#565b66;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);}
.app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--surface);
  border-right:0.5px solid var(--border);overflow-y:auto;z-index:40;transition:transform .2s;
}
.sidebar.hidden{transform:translateX(-100%);}
.sb-head{padding:1.1rem 1rem .8rem;border-bottom:0.5px solid var(--border);}
.sb-head b{color:var(--gold);font-size:14px;}
.sb-head span{display:block;font-size:10px;color:var(--muted);margin-top:2px;}
.sb-nav{padding:.6rem;}
.sb-item{
  display:flex;align-items:center;gap:9px;padding:.55rem .7rem;border-radius:8px;font-size:13px;
  color:var(--muted);cursor:pointer;margin-bottom:2px;
}
.sb-item:hover{background:var(--surface2);}
.sb-item.active{background:var(--navy);color:#fff;}
.sb-item .ic{font-size:14px;width:18px;text-align:center;}

.main{flex:1;margin-left:230px;min-height:100vh;padding-bottom:3rem;transition:margin-left .2s;}
.main.full{margin-left:0;}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%);width:78%;max-width:280px;}
  .sidebar.open{transform:translateX(0);}
  .sidebar.hidden{transform:translateX(-100%);}
  .main{margin-left:0;}
}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:0.5px solid var(--border);
  padding:.8rem 1rem;display:flex;align-items:center;gap:10px;
}
.menu-btn{font-size:18px;cursor:pointer;color:var(--gold);}
.topbar h1{font-size:14px;font-weight:500;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none;}
.overlay.show{display:block;}

.content{padding:1rem;}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.8rem;}
.card h2{font-size:14px;font-weight:500;color:var(--gold);margin-bottom:.6rem;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.stat{background:var(--surface2);border-radius:10px;padding:.7rem;}
.stat b{display:block;font-size:18px;color:var(--text);}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}

.pill{display:inline-block;font-size:10px;padding:2px 9px;border-radius:20px;background:var(--surface2);color:var(--muted);}
.pill.gold{background:rgba(201,162,39,.15);color:var(--gold);}
.pill.green{background:rgba(74,124,89,.2);color:#7fbf94;}

/* checklist */
.chk-item{display:flex;align-items:center;gap:8px;padding:.4rem 0;font-size:13px;border-bottom:0.5px solid var(--border);}
.chk-item:last-child{border-bottom:none;}
.chk{width:16px;height:16px;min-width:16px;border-radius:4px;border:1px solid var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.chk.on{background:var(--gold);border-color:var(--gold);}
.chk.on::after{content:'✓';font-size:10px;color:#0f1115;font-weight:700;}
.chk-text.on{color:var(--dim);text-decoration:line-through;}

/* quick buttons */
.qbtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.qbtn{
  background:var(--surface2);border:0.5px solid var(--border);border-radius:20px;padding:.5rem 1rem;
  font-size:12px;color:var(--text);cursor:pointer;
}
.qbtn:active{background:var(--navy);}

/* day list */
.day-row{
  display:flex;align-items:center;gap:.7rem;padding:.7rem;background:var(--surface);
  border:0.5px solid var(--border);border-radius:10px;margin-bottom:.5rem;cursor:pointer;
}
.day-badge{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}
.day-info b{display:block;font-size:13px;}
.day-info span{font-size:11px;color:var(--muted);}
.day-arrow{margin-left:auto;color:var(--dim);}

/* bairro cards */
.bairro-card{background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:.7rem;}
.bairro-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem;}
.bairro-title b{font-size:15px;}
.stars{color:var(--gold);font-size:12px;}
.bairro-mood{font-size:12px;color:var(--muted);margin-bottom:.5rem;font-style:italic;}
.bairro-section{margin-top:.6rem;}
.bairro-section h4{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;}
.bairro-section p{font-size:12.5px;color:var(--muted);line-height:1.55;}
.street-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:.3rem;}
.street-tag{font-size:11px;background:var(--surface2);padding:2px 8px;border-radius:8px;color:var(--text);}

/* gastro items */
.gastro-item{display:flex;justify-content:space-between;align-items:flex-start;padding:.6rem 0;border-bottom:0.5px solid var(--border);}
.gastro-item:last-child{border-bottom:none;}
.gastro-name{font-size:13px;font-weight:500;}
.gastro-desc{font-size:11.5px;color:var(--muted);margin-top:2px;}
.gastro-tag{font-size:10px;color:var(--gold);white-space:nowrap;margin-left:8px;}

/* fab */
.fab{
  position:fixed;bottom:20px;right:20px;background:var(--gold);color:#0f1115;border-radius:50%;
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;z-index:20;
}

/* sem pressa modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:none;align-items:flex-end;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);width:100%;border-radius:16px 16px 0 0;padding:1.2rem 1rem 2rem;max-height:80vh;overflow-y:auto;}
.modal h3{font-size:15px;margin-bottom:.8rem;}
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.mood-btn{background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:.8rem;text-align:center;font-size:13px;cursor:pointer;}
.mood-btn:active{background:var(--navy);}
.mood-answer{background:var(--surface2);border-left:2px solid var(--gold);border-radius:8px;padding:.8rem;margin-top:.8rem;font-size:13px;line-height:1.6;color:var(--text);}
.modal-close{text-align:center;padding-top:1rem;color:var(--muted);font-size:12px;cursor:pointer;}

textarea, input[type=number]{
  width:100%;background:var(--surface2);border:0.5px solid var(--border);color:var(--text);
  border-radius:8px;padding:.6rem;font-size:13px;font-family:inherit;
}
.small-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:.5rem 1rem;font-size:12.5px;cursor:pointer;margin-top:.5rem;}

.egg-tag{font-size:10px;background:rgba(139,94,60,.3);color:#d09b6f;padding:1px 7px;border-radius:20px;margin-left:5px;}
.hist-toggle{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-size:9px;margin-left:5px;cursor:pointer;}
.hist-box{display:none;font-size:11.5px;color:var(--muted);background:var(--surface2);border-left:2px solid var(--gold);padding:.5rem .7rem;margin-top:5px;border-radius:6px;line-height:1.55;}
.hist-box.open{display:block;}
</style>

  if (data) {

function buildSidebar(){
  const nav = document.getElementById('sbnav');
  nav.innerHTML = NAVS.map(n=>{
    if(n.group !== undefined){
      if(n.group === "") return '';
      return `<div style="font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:.8rem .7rem .3rem;">${n.group}</div>`;
    }
    return `<div class="sb-item" id="nav-${n.id}" onclick="go('${n.id}')"><span class="ic">${n.ic}</span>${n.label}</div>`;
  }).join('');
}

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const main = document.querySelector('.main');
  const isMobile = window.innerWidth <= 760;
  if(isMobile){
    sb.classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  } else {
    sb.classList.toggle('hidden');
    main.classList.toggle('full');
  }
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function go(page, param){
  document.querySelectorAll('.sb-item').forEach(e=>e.classList.remove('active'));
  const navEl = document.getElementById('nav-'+page);
  if(navEl) navEl.classList.add('active');
  closeSidebar();
  window.scrollTo(0,0);
  RENDER[page] ? RENDER[page](param) : RENDER.dashboard();
}

    today = DAYS[0];
    statusLabel = `Faltam ${1-diffDays} dia(s) para a viagem começar — prévia do Dia 1`;

    statusLabel = `Hoje é o Dia ${today.n} da viagem`;

  const allItems = DAYS.flatMap((d,di)=>d.itens.map((it,ii)=>({...it,di,ii})));

     </div>
   </div>
   <div class="card">
     <h2>Antes de sair de casa hoje</h2>
     ${["Documento (RG + passaporte)","Dólar físico + cartão","Powerbank","Casaco médio","Seguro viagem","Ingresso Tango salvo offline"].map((t,i)=>{
       const key='pretrip_'+i; const on=!!state.checks[key];

RENDER.favoritos = function(){

    d.itens.forEach((it,idx)=>{

         <span class="pill" style="cursor:pointer;" onclick="moveFav(${i},-1)">▲</span>

   ${candidatos.map(x=>{
     const on = state.favs.includes(x.key);

  CAMPOS_NUMEROS.forEach(f => totals[f.k] = 0);

    CAMPOS_NUMEROS.forEach(f => totals[f.k] += Number(dia[f.k]||0));
  });

  const missoesFeitas = Object.keys(state.checks).filter(k=>k.startsWith('mission_') && state.checks[k]).length;
  const totalMissoes = Object.keys(BAIRROS).length;

  const diasComDiario = Object.values(state.diary).filter(t=>t && t.trim()).length;

  // top 3 favoritos, se existirem
  const candidatos = [];
  DAYS.forEach(d=>{
    d.itens.forEach((it,idx)=>{
      if(it.g || it.egg){
        candidatos.push({key:'fav_d'+d.n+'_i'+idx, nome: it.x.replace(/^(🍦|🥚|\[OPCIONAL\]\s*)/,'').trim()});
      }
    });
  });
  Object.entries(BAIRROS).forEach(([k,b])=> candidatos.push({key:'fav_bairro_'+k, nome:b.nome}));
  const byKey = {}; candidatos.forEach(x=>byKey[x.key]=x);
  const top3 = state.favOrder.map(k=>byKey[k]).filter(Boolean).slice(0,3);

  const algumMelhor = MELHORES.some(m => state.melhores[m.k] && state.melhores[m.k].trim());

  document.getElementById('content').innerHTML = `

     <div style="font-size:11px;letter-spacing:.15em;color:var(--gold);">🇦🇷 SUA VIAGEM A BUENOS AIRES</div>

     <div style="font-size:12px;color:var(--muted);margin-top:2px;">15 a 22 de setembro</div>
   </div>

   <div class="card"><h2>📊 Os números</h2>
     <div class="grid2">
       ${CAMPOS_NUMEROS.map(f=>`<div class="stat"><b>${totals[f.k]}</b><span>${f.ic} ${f.label}</span></div>`).join('')}
       <div class="stat"><b>${missoesFeitas}/${totalMissoes}</b><span>🎯 missões concluídas</span></div>
       <div class="stat"><b>${state.favs.length}</b><span>❤️ favoritos marcados</span></div>
       <div class="stat"><b>${colecaoFeita}/${COLECAO.length}</b><span>🏅 coleção completa</span></div>
       <div class="stat"><b>${diasComDiario}/${DAYS.length}</b><span>📓 dias com anotação</span></div>
     </div>
   </div>

   ${algumMelhor ? `
   <div class="card"><h2>🏆 Os melhores</h2>
     ${MELHORES.map(m=> state.melhores[m.k] && state.melhores[m.k].trim() ? `<div class="gastro-item"><div><div class="gastro-name">${m.ic} ${m.label}</div><div class="gastro-desc" style="color:var(--gold);">${state.melhores[m.k]}</div></div></div>` : '').join('')}
   </div>` : `<div class="card"><h2>🏆 Os melhores</h2><p style="font-size:12px;color:var(--muted);">Preencha em "Números da viagem" — assim que escrever, aparece aqui.</p></div>`}

   ${top3.length ? `
   <div class="card"><h2>⭐ Seu pódio</h2>
     ${top3.map((x,i)=>`<div class="gastro-item"><div style="display:flex;align-items:center;gap:8px;"><div class="stop-num">${i+1}</div><div class="gastro-name">${x.nome}</div></div></div>`).join('')}
   </div>` : ''}

   <div class="card"><h2>📓 Diário — trechos</h2>
     ${diasComDiario ? DAYS.filter(d=>state.diary['d'+d.n] && state.diary['d'+d.n].trim()).map(d=>`<div style="margin-bottom:.6rem;"><b style="font-size:12px;color:var(--gold);">Dia ${d.n}</b><p style="font-size:12px;color:var(--muted);margin-top:2px;">${state.diary['d'+d.n]}</p></div>`).join('') : `<p style="font-size:12px;color:var(--muted);">Nenhuma anotação ainda — escreva no Diário durante a viagem para ver aqui depois.</p>`}
   </div>

   <div class="card" style="text-align:center;">
     <p style="font-size:13px;color:var(--muted);font-style:italic;">"Daqui um ano, que essa tela te faça lembrar: foi uma viagem incrível."</p>

 {k:"empanadas", label:"empanadas", ic:"🥟"},
 {k:"pizzas", label:"pizzas", ic:"🍕"},
 {k:"doces", label:"doces", ic:"🍰"},
 {k:"cervejas", label:"cervejas", ic:"🍺"},
 {k:"drinks", label:"drinks", ic:"🍸"},
 {k:"fotos", label:"fotos tiradas", ic:"📸"},
];

const MELHORES = [
 {k:"bairro", label:"Bairro favorito", ic:"🏆"},
 {k:"cafe", label:"Melhor café", ic:"☕"},
 {k:"vinho", label:"Melhor vinho", ic:"🍷"},
 {k:"parrilla", label:"Melhor parrilla", ic:"🥩"},
 {k:"sorvete", label:"Melhor sorvete", ic:"🍦"},
 {k:"pordosol", label:"Melhor pôr do sol", ic:"🌅"},
 {k:"momento", label:"Momento favorito da viagem", ic:"❤️"},
];

const COLECAO = ["Malbec","Torrontés","Fernet","Doce de leite","Alfajor","Empanada","Choripán","Provoleta","Bife de Chorizo","Milanesa","Fugazzeta","Mate","Locro","Chivito"];

RENDER.numeros = function(){
  document.getElementById('pagetitle').textContent = 'Números da viagem';
  if(!state.numeros) state.numeros = {};
  if(!state.melhores) state.melhores = {};
  if(!state.colecao) state.colecao = {};

  const totals = {};
  CAMPOS_NUMEROS.forEach(f => totals[f.k] = 0);
  Object.values(state.numeros).forEach(dia=>{
    CAMPOS_NUMEROS.forEach(f => totals[f.k] += Number(dia[f.k]||0));
  });

  const missoesFeitas = Object.keys(state.checks).filter(k=>k.startsWith('mission_') && state.checks[k]).length;
  const colecaoFeita = COLECAO.filter(x => state.colecao[x]).length;

  const painelHtml = `
   <div class="card" style="background:linear-gradient(160deg,var(--surface2),var(--surface));border-color:var(--gold);">
     <div style="text-align:center;margin-bottom:.8rem;">
       <div style="font-size:11px;letter-spacing:.15em;color:var(--gold);">🇦🇷 SUA VIAGEM</div>
       <div style="font-size:22px;font-weight:600;margin-top:2px;">${DAYS.length} dias</div>
     </div>
     <div class="grid2">
       ${CAMPOS_NUMEROS.map(f=>`<div class="stat" id="stat-${f.k}"><b>${totals[f.k]}</b><span>${f.ic} ${f.label}</span></div>`).join('')}
       <div class="stat"><b>${missoesFeitas}</b><span>🎯 missões concluídas</span></div>
       <div class="stat"><b>${state.favs.length}</b><span>❤️ favoritos</span></div>
       <div class="stat"><b>${colecaoFeita}/${COLECAO.length}</b><span>🏅 coleção completa</span></div>
     </div>
   </div>

   <div class="card"><h2>🏆 Os melhores da viagem</h2>
   <p style="font-size:11px;color:var(--muted);margin-bottom:.6rem;">Escreva livremente — isso é o que vai virar sua história depois.</p>
   ${MELHORES.map(m=>`
     <div style="margin-bottom:.6rem;">
       <label style="font-size:11.5px;color:var(--gold);display:block;margin-bottom:3px;">${m.ic} ${m.label}</label>
       <input type="text" value="${state.melhores[m.k]||''}" placeholder="escreva aqui..."
         onchange="setMelhor('${m.k}',this.value)">
     </div>
   `).join('')}
   </div>`;

  const colecaoHtml = `
   <div class="card"><h2>🎒 Coleção — experimentei</h2>
   <p style="font-size:11px;color:var(--muted);margin-bottom:.4rem;">Vá marcando conforme for provando cada clássico argentino.</p>
   ${COLECAO.map(item=>{
     const on = !!state.colecao[item];
     return `<div class="chk-item"><div class="chk ${on?'on':''}" onclick="toggleColecao('${item}')"></div><div class="chk-text ${on?'on':''}">${item}</div></div>`;
   }).join('')}
   </div>`;

  const diasHtml = DAYS.map(d=>{
    const vals = state.numeros[d.n] || {};
    const isOpen = numeroDiaAberto === d.n;
    return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="toggleNumeroDia(${d.n})">
        <h2 style="margin-bottom:0;">Dia ${d.n} — ${d.title}</h2>
        <span style="color:var(--dim);font-size:12px;">${isOpen?'▾':'▸'}</span>
      </div>
      ${isOpen ? `
      <div class="grid2" style="margin-top:.6rem;">
        ${CAMPOS_NUMEROS.map(f=>`
          <div>
            <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:3px;">${f.ic} ${f.label}</label>
            <input type="number" min="0" value="${vals[f.k] ?? ''}" placeholder="0"
              onchange="setNumero(${d.n},'${f.k}',this.value)">
          </div>
        `).join('')}
      </div>` : ''}
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = painelHtml + colecaoHtml + diasHtml;
};
let numeroDiaAberto = null;
function toggleNumeroDia(n){ numeroDiaAberto = (numeroDiaAberto === n) ? null : n; RENDER.numeros(); }

function setNumero(dia, campo, valor){
  if(!state.numeros) state.numeros = {};
  if(!state.numeros[dia]) state.numeros[dia] = {};
  state.numeros[dia][campo] = valor;
  setState(state);
  let total = 0;
  Object.values(state.numeros).forEach(d=> total += Number(d[campo]||0));
  const el = document.querySelector('#stat-'+campo+' b');
  if(el) el.textContent = total;
}
function setMelhor(campo, valor){
  if(!state.melhores) state.melhores = {};
  state.melhores[campo] = valor;
  setState(state);
}
function toggleColecao(item){
  if(!state.colecao) state.colecao = {};
  state.colecao[item] = !state.colecao[item];
  setState(state);
  rerenderCurrent();
}

function toggleChk(key){
  state.checks[key] = !state.checks[key];
  setState(state);
  rerenderCurrent();
}
function toggleFav(key){
  if(state.favs.includes(key)) state.favs = state.favs.filter(k=>k!==key);
  else state.favs.push(key);
  setState(state);
  rerenderCurrent();
}
function addCustomFav(){
  const input = document.getElementById('customFavInput');
  const val = input.value.trim();
  if(!val) return;
  if(!state.customFavs) state.customFavs = [];
  state.customFavs.push(val);
  const newKey = 'fav_custom_' + (state.customFavs.length - 1);
  if(!state.favs.includes(newKey)) state.favs.push(newKey);
  setState(state);
  rerenderCurrent();
}

function moveFav(idx, dir){
  const arr = state.favOrder;
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= arr.length) return;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];
  setState(state);
  rerenderCurrent();
}
function toggleHist(id){ document.getElementById(id).classList.toggle('open'); }
function saveDiary(n){ state.diary['d'+n] = document.getElementById('diaryBox').value; setState(state); alert('Salvo!'); }
function exportBackup(){ const blob = new Blob([JSON.stringify(state)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ba_backup.json'; a.click(); }
function resetApp(){
  if(confirm('Apagar tudo e recomeçar do zero?')){
    localStorage.removeItem('ba_state');
    state = {checks:{},diary:{},favs:[],favOrder:[],customFavs:[],numeros:{},melhores:{},colecao:{},reservas:{},budget:50};
    stateRef.set(state);
    companheiroMode = {};
    bairroAberto = null;
    numeroDiaAberto = null;
    go('dashboard');
  }
}

let currentPage = 'dashboard', currentParam = null;
const _go = go;
go = function(page, param){ currentPage = page; currentParam = param; _go(page, param); };
function rerenderCurrent(){ RENDER[currentPage] ? RENDER[currentPage](currentParam) : RENDER.dashboard(); }

/* ================= MOOD MODAL ================= */
const WANTS = [
 {k:"cafe",label:"☕ Café",field:"cafe"},
 {k:"sorvete",label:"🍦 Sorvete",field:"sorvete"},
 {k:"vinho",label:"🍷 Vinho / drink",field:"vinho"},
 {k:"comprar",label:"🛍️ Comprar",field:"comprar"},
 {k:"descansar",label:"🪑 Descansar",field:"descansar"},
 {k:"fotografar",label:"📸 Fotografar",field:"fotografar"},
];
let moodBairro = null;

function openMood(){
  moodBairro = null;
  renderMoodStep1();
  document.getElementById('moodOverlay').classList.add('show');
}
function renderMoodStep1(){
  document.querySelector('.modal h3').textContent = 'Sem pressa nenhuma — onde você está agora?';
  const grid = document.getElementById('moodGrid');
  grid.innerHTML = Object.entries(BAIRROS).map(([key,b])=>`<div class="mood-btn" onclick="pickBairro('${key}')">${b.nome}</div>`).join('');
  document.getElementById('moodAnswer').innerHTML = '';
}
function pickBairro(key){
  moodBairro = key;
  const b = BAIRROS[key];
  document.querySelector('.modal h3').textContent = `Você está em ${b.nome}. O que você quer agora?`;
  const grid = document.getElementById('moodGrid');
  grid.innerHTML = WANTS.filter(w=>b[w.field] && b[w.field]!=='—').map(w=>`<div class="mood-btn" onclick="answerMood('${w.field}')">${w.label}</div>`).join('')
    || '<div style="font-size:12px;color:var(--muted);grid-column:1/-1;">Esse bairro não tem sugestão específica nessas categorias — bom para só caminhar.</div>';
  grid.innerHTML += `<div class="mood-btn" style="grid-column:1/-1;background:transparent;border-style:dashed;" onclick="renderMoodStep1()">‹ trocar de bairro</div>`;
  document.getElementById('moodAnswer').innerHTML = '';
}
function answerMood(field){
  const b = BAIRROS[moodBairro];
  document.getElementById('moodAnswer').innerHTML = `<div class="mood-answer"><b>${b.nome}:</b> ${b[field]}</div>`;
}
function closeMood(){ document.getElementById('moodOverlay').classList.remove('show'); }

/* ================= INIT ================= */
buildSidebar();
go('dashboard');
</script>
